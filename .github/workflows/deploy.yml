name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets exist only in this environment. The environment allows deploys
    # from `main` only and waits for the owner's approval.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship code and .env, restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # T4 vision (docs/t4-vision.md). An empty key leaves the feature off.
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_BASE_URL: https://openrouter.ai/api/v1/chat/completions
          VISION_MODEL: google/gemini-3.6-flash
          VISION_HOST_ALLOWLIST: openrouter.ai
          VISION_DAILY_CAP_USD: "5"
          # Free-check counter key (D-12). Unset or shorter than 32 characters keeps the vision check off.
          CHECK_COUNTER_SALT: ${{ secrets.CHECK_COUNTER_SALT }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ${VPS_USER}@${VPS_HOST}"
          git archive --format=tar HEAD | $SSH 'rm -rf ~/app.new && mkdir -p ~/app.new && tar -x -C ~/app.new'
          printf 'TELEGRAM_BOT_TOKEN=%s\nVISION_API_KEY=%s\nVISION_BASE_URL=%s\nVISION_MODEL=%s\nVISION_HOST_ALLOWLIST=%s\nVISION_DAILY_CAP_USD=%s\nCHECK_COUNTER_SALT=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$VISION_API_KEY" "$VISION_BASE_URL" "$VISION_MODEL" "$VISION_HOST_ALLOWLIST" "$VISION_DAILY_CAP_USD" "$CHECK_COUNTER_SALT" \
            | $SSH 'umask 077 && cat > ~/app.new/.env'
          $SSH 'set -e; rm -rf ~/app.prev; if [ -d ~/app ]; then mv ~/app ~/app.prev; fi; mv ~/app.new ~/app; cd ~/app && docker compose up -d --build --remove-orphans && docker compose ps'

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_deploy
