services:
  bot:
    build: .
    image: photo-check-bot:latest
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - botdata:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  botdata:
